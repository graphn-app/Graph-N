<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Фильтр для неонового свечения и тени сетки -->
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" result="glow"/>
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.9" />
    </filter>
    
    <!-- Простая тень для медных узлов (чтобы они оставались четкими) -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <!-- Диагональная маска для эффекта затухания сетки -->
    <linearGradient id="fadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="35%" stop-color="white" stop-opacity="1" />
      <stop offset="85%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="fadeMask">
      <rect width="256" height="256" fill="url(#fadeGrad)" />
    </mask>
  </defs>

  <!-- Раскомментируй строку ниже, если хочешь вернуть темно-синий матовый фон -->
  <!-- <rect width="100%" height="100%" fill="#192028"/> -->

  <!-- Группа с маской затухания -->
  <g mask="url(#fadeMask)">
    
    <!-- Ребра графа (гексагональная сетка) -->
    <path stroke="#2980b9" stroke-width="4.5" fill="none" filter="url(#neon)" stroke-linecap="round" stroke-linejoin="round" d="
      M0,0 L0,25 M0,75 L0,100 M0,150 L0,175 M0,225 L0,250
      M86.6,0 L86.6,25 M86.6,75 L86.6,100 M86.6,150 L86.6,175 M86.6,225 L86.6,250
      M173.2,0 L173.2,25 M173.2,75 L173.2,100 M173.2,150 L173.2,175 M173.2,225 L173.2,250
      M259.8,0 L259.8,25 M259.8,75 L259.8,100 M259.8,150 L259.8,175 M259.8,225 L259.8,250
      
      M43.3,37.5 L43.3,62.5 M43.3,112.5 L43.3,137.5 M43.3,187.5 L43.3,212.5 M43.3,262.5 L43.3,287.5
      M129.9,37.5 L129.9,62.5 M129.9,112.5 L129.9,137.5 M129.9,187.5 L129.9,212.5 M129.9,262.5 L129.9,287.5
      M216.5,37.5 L216.5,62.5 M216.5,112.5 L216.5,137.5 M216.5,187.5 L216.5,212.5 M216.5,262.5 L216.5,287.5

      M0,25 L43.3,37.5 M0,100 L43.3,112.5 M0,175 L43.3,187.5 M0,250 L43.3,262.5
      M86.6,25 L129.9,37.5 M86.6,100 L129.9,112.5 M86.6,175 L129.9,187.5 M86.6,250 L129.9,262.5
      M173.2,25 L216.5,37.5 M173.2,100 L216.5,112.5 M173.2,175 L216.5,187.5 M173.2,250 L216.5,262.5
      
      M43.3,62.5 L86.6,75 M43.3,137.5 L86.6,150 M43.3,212.5 L86.6,225
      M129.9,62.5 L173.2,75 M129.9,137.5 L173.2,150 M129.9,212.5 L173.2,225
      M216.5,62.5 L259.8,75 M216.5,137.5 L259.8,150 M216.5,212.5 L259.8,225

      M0,75 L43.3,62.5 M0,150 L43.3,137.5 M0,225 L43.3,212.5
      M86.6,75 L129.9,62.5 M86.6,150 L129.9,137.5 M86.6,225 L129.9,212.5
      M173.2,75 L216.5,62.5 M173.2,150 L216.5,137.5 M173.2,225 L216.5,212.5

      M43.3,37.5 L86.6,25 M43.3,112.5 L86.6,100 M43.3,187.5 L86.6,175 M43.3,262.5 L86.6,250
      M129.9,37.5 L173.2,25 M129.9,112.5 L173.2,100 M129.9,187.5 L173.2,175 M129.9,262.5 L173.2,250
      M216.5,37.5 L259.8,25 M216.5,112.5 L259.8,100 M216.5,187.5 L259.8,175 M216.5,262.5 L259.8,250
    "/>

    <!-- Медные узлы -->
    <g fill="#c86934" filter="url(#shadow)">
      <!-- Столбец 1 -->
      <circle cx="0" cy="0" r="4"/><circle cx="0" cy="25" r="4"/><circle cx="0" cy="75" r="4"/><circle cx="0" cy="100" r="4"/><circle cx="0" cy="150" r="4"/><circle cx="0" cy="175" r="4"/><circle cx="0" cy="225" r="4"/><circle cx="0" cy="250" r="4"/>
      <!-- Столбец 2 -->
      <circle cx="43.3" cy="37.5" r="4"/><circle cx="43.3" cy="62.5" r="4"/><circle cx="43.3" cy="112.5" r="4"/><circle cx="43.3" cy="137.5" r="4"/><circle cx="43.3" cy="187.5" r="4"/><circle cx="43.3" cy="212.5" r="4"/><circle cx="43.3" cy="262.5" r="4"/>
      <!-- Столбец 3 -->
      <circle cx="86.6" cy="0" r="4"/><circle cx="86.6" cy="25" r="4"/><circle cx="86.6" cy="75" r="4"/><circle cx="86.6" cy="100" r="4"/><circle cx="86.6" cy="150" r="4"/><circle cx="86.6" cy="175" r="4"/><circle cx="86.6" cy="225" r="4"/><circle cx="86.6" cy="250" r="4"/>
      <!-- Столбец 4 -->
      <circle cx="129.9" cy="37.5" r="4"/><circle cx="129.9" cy="62.5" r="4"/><circle cx="129.9" cy="112.5" r="4"/><circle cx="129.9" cy="137.5" r="4"/><circle cx="129.9" cy="187.5" r="4"/><circle cx="129.9" cy="212.5" r="4"/><circle cx="129.9" cy="262.5" r="4"/>
      <!-- Столбец 5 -->
      <circle cx="173.2" cy="0" r="4"/><circle cx="173.2" cy="25" r="4"/><circle cx="173.2" cy="75" r="4"/><circle cx="173.2" cy="100" r="4"/><circle cx="173.2" cy="150" r="4"/><circle cx="173.2" cy="175" r="4"/><circle cx="173.2" cy="225" r="4"/><circle cx="173.2" cy="250" r="4"/>
      <!-- Столбец 6 -->
      <circle cx="216.5" cy="37.5" r="4"/><circle cx="216.5" cy="62.5" r="4"/><circle cx="216.5" cy="112.5" r="4"/><circle cx="216.5" cy="137.5" r="4"/><circle cx="216.5" cy="187.5" r="4"/><circle cx="216.5" cy="212.5" r="4"/><circle cx="216.5" cy="262.5" r="4"/>
      <!-- Столбец 7 -->
      <circle cx="259.8" cy="0" r="4"/><circle cx="259.8" cy="25" r="4"/><circle cx="259.8" cy="75" r="4"/><circle cx="259.8" cy="100" r="4"/><circle cx="259.8" cy="150" r="4"/><circle cx="259.8" cy="175" r="4"/><circle cx="259.8" cy="225" r="4"/><circle cx="259.8" cy="250" r="4"/>
    </g>
  </g>
</svg>
