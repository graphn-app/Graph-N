<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#4db8ff" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="#192028"/>
  
  <g stroke="#2980b9" stroke-width="4.5" fill="none" filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Grid -->
    <polygon points="128,93 158.3,110.5 158.3,145.5 128,163 97.7,145.5 97.7,110.5" />
    <polygon points="158.3,40.5 188.6,58 188.6,93 158.3,110.5 128,93 128,58" />
    <polygon points="158.3,145.5 188.6,163 188.6,198 158.3,215.5 128,198 128,163" />
    <polygon points="97.7,145.5 128,163 128,198 97.7,215.5 67.4,198 67.4,163" />
    <polygon points="67.4,58 97.7,75.5 97.7,110.5 67.4,128 37.1,110.5 37.1,75.5" />
    <line x1="188.6" y1="93" x2="218.9" y2="110.5" />
    <line x1="188.6" y1="163" x2="218.9" y2="145.5" />
    <line x1="67.4" y1="198" x2="37.1" y2="215.5" />
    <line x1="97.7" y1="40.5" x2="128" y2="58" />
    <line x1="67.4" y1="58" x2="97.7" y2="40.5" />
  </g>

  <!-- Mask Overlay -->
  <g filter="url(#glow)">
    <polygon points="128,58 158.3,40.5 188.6,58 188.6,93 158.3,110.5 158.3,145.5 128,163 97.7,145.5 97.7,110.5 128,93" fill="url(#maskGrad)" stroke="#b3e5fc" stroke-width="2"/>
  </g>

  <!-- Joints -->
  <g fill="#c86934" filter="url(#shadow)">
    <circle cx="128" cy="93" r="4.5"/>
    <circle cx="158.3" cy="110.5" r="4.5"/>
    <circle cx="158.3" cy="145.5" r="4.5"/>
    <circle cx="128" cy="163" r="4.5"/>
    <circle cx="97.7" cy="145.5" r="4.5"/>
    <circle cx="97.7" cy="110.5" r="4.5"/>
    <circle cx="158.3" cy="40.5" r="4.5"/>
    <circle cx="188.6" cy="58" r="4.5"/>
    <circle cx="188.6" cy="93" r="4.5"/>
    <circle cx="128" cy="58" r="4.5"/>
    <circle cx="188.6" cy="163" r="4.5"/>
    <circle cx="128" cy="198" r="4.5"/>
    <circle cx="67.4" cy="163" r="4.5"/>
    <circle cx="97.7" cy="75.5" r="4.5"/>
  </g>
</svg>
