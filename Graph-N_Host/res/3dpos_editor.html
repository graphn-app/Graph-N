<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Graph-N 3D Pose Editor</title>
    <style>
        :root {
            --bg: #1e1e1e; --panel: #2d2d30; --border: #3e3e42; 
            --text: #cccccc; --accent: #007acc; --hover: #3e3e42;
            --success: #2ea043; --danger: #d73a49;
        }
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Segoe UI', sans-serif; height: 100vh; 
            display: flex; flex-direction: column; overflow: hidden; user-select: none; 
        }
        
        /* TOOLBARS */
        .toolbar {
            background: var(--panel); border: 1px solid var(--border);
            display: grid; grid-template-columns: 1fr auto 1fr;
            padding: 0 10px; align-items: center; z-index: 100; cursor: default;
        }
        #top-bar { border-bottom: 1px solid var(--border); height: 44px; }
        #bottom-bar { border-top: 1px solid var(--border); height: 40px; padding-bottom: 5px; }

        .bar-left { display: flex; justify-self: start; align-items: center; gap: 10px; height: 100%; }
        .bar-center { display: flex; justify-self: center; align-items: center; height: 100%; }
        .bar-right { display: flex; justify-self: end; align-items: center; height: 100%; }

        .tool-group { display: flex; gap: 4px; border-right: 1px solid var(--border); padding-right: 10px; margin-right: 10px; align-items: center; height: 100%; }
        .tool-group:last-child { border: none; margin-right: 0; padding-right: 0; }
        .tool-col { display: flex; flex-direction: column; gap: 2px; justify-content: center; }
        
        button {
            background: transparent; color: var(--text); border: 1px solid transparent;
            padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 13px; min-width: 30px;
            transition: all 0.1s; height: 28px; display: flex; align-items: center; justify-content: center;
        }
        button:hover { background: var(--hover); }
        button.active { background: var(--accent); color: white; border-color: var(--accent); }
        button:active { transform: translateY(1px); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .btn-output { background: #2d2d30; color: var(--success); border: 1px solid var(--success); font-weight: bold; }
        .btn-output:hover { background: var(--success); color: white; }

        /* INPUTS */
        input[type=range] { accent-color: var(--accent); cursor: pointer; width: 80px; height: 4px; vertical-align: middle; }
        input[type=number] {
            background: #222; border: 1px solid #444; color: #fff;
            width: 40px; border-radius: 2px; padding: 2px;
            font-family: monospace; font-size: 11px; text-align: center;
        }
        input[type=number]:focus { border-color: var(--accent); outline: none; }
        .label-row { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: #888; width: 100%; gap: 5px;}

        /* WORKSPACE */
        #workspace {
            flex-grow: 1; position: relative; overflow: hidden; 
            background-color: #1e1e1e; display: flex; align-items: center; justify-content: center;
            background-image: 
                linear-gradient(45deg, #252525 25%, transparent 25%), 
                linear-gradient(-45deg, #252525 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #252525 75%), 
                linear-gradient(-45deg, transparent 75%, #252525 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        #canvasContainer { position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.5); }

        #bgImage {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            opacity: 0.6; pointer-events: none; object-fit: contain; z-index: 1;
        }

        canvas { position: relative; z-index: 2; }

        #res-info { font-size: 11px; color: #888; font-family: monospace; }
        #controls-info { font-size: 11px; color: #888; }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
</head>
<body>

    <div id="top-bar" class="toolbar">
        <div class="bar-left">
            <span style="font-weight: 600; color: white;">3D Pose Editor</span>
        </div>

        <div class="bar-center">
            <div class="tool-group">
                <button id="btnUndo" title="Undo (Ctrl+Z)" disabled>&#8617;</button>
                <button id="btnRedo" title="Redo (Ctrl+Y)" disabled>&#8618;</button>
            </div>
            <div class="tool-group">
                <button id="btnToggleImage" class="active" title="Toggle Background Image">Image</button>
                <button id="btnToggleGrid" class="active" title="Toggle Grid">Grid</button>
                <button id="btnToggleSkel" class="active" title="Toggle Skeleton">Skeleton</button>
                <button id="btnReset" title="Reset to T-Pose">Reset Pose</button>
            </div>
        </div>

        <div class="bar-right">
            <div class="tool-group" style="border: none;">
                <button id="btnSaveHost" class="btn-output" title="Send back to Graph-N">Save to node</button>
                <button id="btnExport" class="btn-output" title="Save as PNG to disk">Export to file</button>
            </div>
        </div>
    </div>

    <div id="workspace">
        <div id="canvasContainer">
            <img id="bgImage" src="">
            <!-- WebGL injected here -->
        </div>
    </div>

    <div id="bottom-bar" class="toolbar">
        <div class="bar-left">
            <span id="res-info">Loading...</span>
        </div>

        <div class="bar-center">
            <div class="tool-group" style="border:none">
                <div class="tool-col">
                    <div class="label-row">
                        <span>Thickness</span> 
                        <input type="number" id="numThickness" min="0.1" max="1.0" step="0.05" value="0.5">
                    </div>
                    <input type="range" id="rngThickness" min="0.1" max="1.0" step="0.05" value="0.5">
                </div>
            </div>
        </div>

        <div class="bar-right">
            <span id="controls-info">LMB: Move Joint | Shift+LMB: Move All | RMB: Rotate Cam | MMB: Pan | Esc: Deselect</span>
        </div>
    </div>

    <script>
        const API_BASE = "http://app.local";

        // === OPENPOSE SPEC ===
        const JOINT_COUNT = 19;
        const OP_COLORS = [
            0xff0000, 0xff5500, 0xffaa00, 0xffff00, 0xaaff00, 0x55ff00, 0x00ff00, 
            0x00ff55, 0x00ffaa, 0x00ffff, 0x00aaff, 0x0055ff, 0x0000ff, 0x5500ff, 
            0xaa00ff, 0xff00ff, 0xff00aa, 0xff0055, 0xffaa55
        ];

        const BONE_PAIRS = [
            [1, 8], [1, 2], [1, 5], [2, 3], [3, 4], [5, 6], [6, 7],
            [8, 9], [9, 10], [10, 11], [8, 12], [12, 13], [13, 14],
            [1, 0], [0, 15], [15, 17], [0, 16], [16, 18]
        ];

        const BONE_COLORS = [
            0xff0000, 0xff5500, 0xffaa00, 0xffff00, 0xaaff00, 0x55ff00, 0x00ff00,
            0x00ff55, 0x00ffaa, 0x00ffff, 0x00aaff, 0x0055ff, 0x0000ff, 
            0x5500ff, 0xaa00ff, 0xff00ff, 0xff00aa, 0xff0055
        ];

        const DEFAULT_POSITIONS = [
            [0, 15, 2],    // 0: Nose
            [0, 13, 0],    // 1: Neck
            [-4, 13, 0],   // 2: RShoulder
            [-8, 13, 0],   // 3: RElbow
            [-12, 13, 0],  // 4: RWrist
            [4, 13, 0],    // 5: LShoulder
            [8, 13, 0],    // 6: LElbow
            [12, 13, 0],   // 7: LWrist
            [0, 6, 0],     // 8: MidHip
            [-3, 6, 0],    // 9: RHip
            [-3, -1, 0],   // 10: RKnee
            [-3, -8, 0],   // 11: RAnkle
            [3, 6, 0],     // 12: LHip
            [3, -1, 0],    // 13: LKnee
            [3, -8, 0],    // 14: LAnkle
            [-1, 16, 2],   // 15: REye
            [1, 16, 2],    // 16: LEye
            [-2, 15, 1],   // 17: REar
            [2, 15, 1]     // 18: LEar
        ];

        const INJECTED_SETTINGS = /*APP_SETTINGS_TOKEN*/;
        
        const defaultSettings = {
            thickness: 0.5,
            skeletonVisible: true,
            imageVisible: true,
            gridVisible: true
        };

		const originType = INJECTED_SETTINGS?.origin || 'input';		
		const btnSave = document.getElementById('btnSaveHost');
        if (originType === 'output') {
            btnSave.innerText = "Upload to server";
            btnSave.title = "Mask/Image will be uploaded to server and available in LoadImage nodes";
        } else {
            btnSave.innerText = "Save to node";
            btnSave.title = "Save and apply to the current node";
        }
		
		if (INJECTED_SETTINGS?.debug) {
			btnSave.disabled = true;
		}

        // === STATE & HISTORY ===
		const state = {
            thickness: INJECTED_SETTINGS?.thickness ?? defaultSettings.thickness,
            skeletonVisible: INJECTED_SETTINGS?.skeletonVisible ?? defaultSettings.skeletonVisible,
            imageVisible: INJECTED_SETTINGS?.imageVisible ?? defaultSettings.imageVisible,
            gridVisible: INJECTED_SETTINGS?.gridVisible ?? defaultSettings.gridVisible,
            
            imgWidth: 768,
            imgHeight: 768,
            history: [],
            historyStep: -1,
            isDragging: false
        };

        const workspace = document.getElementById('workspace');
        const container = document.getElementById('canvasContainer');
        const bgImage = document.getElementById('bgImage');
        const resInfo = document.getElementById('res-info');
        const btnUndo = document.getElementById('btnUndo');
        const btnRedo = document.getElementById('btnRedo');

        // === THREE.JS INIT ===
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.set(0, 5, 45);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
        renderer.setClearColor(0x000000, 0); 
        container.appendChild(renderer.domElement);

        const gridHelper = new THREE.GridHelper(50, 50, 0x444444, 0x222222);
        gridHelper.position.y = -10;
        scene.add(gridHelper);

        const skeletonGroup = new THREE.Group();
        scene.add(skeletonGroup);

        // === CONTROLS ===
        const orbit = new THREE.OrbitControls(camera, renderer.domElement);
        orbit.target.set(0, 5, 0);
        orbit.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE };
        orbit.update();

        const transformControl = new THREE.TransformControls(camera, renderer.domElement);
        transformControl.setSize(0.6); 
        scene.add(transformControl);

        let isGizmoHovered = false;
        transformControl.addEventListener('hoveron', () => isGizmoHovered = true);
        transformControl.addEventListener('hoveroff', () => isGizmoHovered = false);

        transformControl.addEventListener('dragging-changed', function (event) {
            state.isDragging = event.value;
            orbit.enabled = !event.value;
            if (!event.value) saveHistory(); 
        });

        // === RIG BUILDING ===
        const joints = [];
        const bones = [];
        const jointGeom = new THREE.SphereGeometry(0.8, 16, 16);
        const boneGeom = new THREE.CylinderGeometry(0.5, 0.5, 1, 8);
        boneGeom.translate(0, 0.5, 0);

        for (let i = 0; i < JOINT_COUNT; i++) {
            const mat = new THREE.MeshBasicMaterial({ color: OP_COLORS[i], depthTest: false });
            const sphere = new THREE.Mesh(jointGeom, mat);
            sphere.position.set(...DEFAULT_POSITIONS[i]);
            sphere.userData.id = i;
            sphere.renderOrder = 1;
            skeletonGroup.add(sphere);
            joints.push(sphere);
        }

        for (let i = 0; i < BONE_PAIRS.length; i++) {
            const mat = new THREE.MeshBasicMaterial({ color: BONE_COLORS[i], depthTest: false });
            const bone = new THREE.Mesh(boneGeom, mat);
            bone.renderOrder = 0;
            skeletonGroup.add(bone);
            bones.push(bone);
        }

        function updateBones() {
            const t = state.thickness;
            for (let i = 0; i < JOINT_COUNT; i++) {
                joints[i].scale.set(t, t, t);
            }
            for (let i = 0; i < BONE_PAIRS.length; i++) {
                const start = joints[BONE_PAIRS[i][0]].position;
                const end = joints[BONE_PAIRS[i][1]].position;
                const distance = start.distanceTo(end);
                
                bones[i].position.copy(start);
                bones[i].scale.set(t, distance, t);
                bones[i].quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), end.clone().sub(start).normalize());
            }
        }
        updateBones();

        // === IMAGE LOADING ===
        bgImage.onload = () => {
            state.imgWidth = bgImage.naturalWidth;
            state.imgHeight = bgImage.naturalHeight;
            resInfo.innerText = `${state.imgWidth}x${state.imgHeight}px`;
            resizeWorkspace();
            saveHistory(); 
        };
        bgImage.src = `${API_BASE}/input.png?t=` + Date.now();

        function resizeWorkspace() {
            if (state.imgWidth === 0) return;
            const wsAspect = workspace.clientWidth / workspace.clientHeight;
            const imgAspect = state.imgWidth / state.imgHeight;
            
            let w, h;
            if (wsAspect > imgAspect) {
                h = workspace.clientHeight - 20;
                w = h * imgAspect;
            } else {
                w = workspace.clientWidth - 20;
                h = w / imgAspect;
            }

            container.style.width = `${w}px`;
            container.style.height = `${h}px`;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', resizeWorkspace);

        // === INTERACTION ===
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('pointermove', (e) => {
            if (!state.skeletonVisible || isGizmoHovered || state.isDragging) return;
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            renderer.domElement.style.cursor = raycaster.intersectObjects(joints).length > 0 ? 'pointer' : 'default';
        });

        renderer.domElement.addEventListener('pointerdown', (e) => {
            if (e.button !== 0 || !state.skeletonVisible || isGizmoHovered) return; 
            
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(joints);

            if (e.shiftKey) {
                transformControl.attach(skeletonGroup);
            } else if (intersects.length > 0) {
                transformControl.attach(intersects[0].object);
            } else {
                transformControl.detach();
            }
        }, { capture: true });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') transformControl.detach();
            if (e.ctrlKey && e.code === 'KeyZ') { undo(); e.preventDefault(); }
            if (e.ctrlKey && e.code === 'KeyY') { redo(); e.preventDefault(); }
        });

        // === HISTORY SYSTEM ===
        function saveHistory() {
            if (state.historyStep < state.history.length - 1) {
                state.history = state.history.slice(0, state.historyStep + 1);
            }
            if (state.history.length > 30) state.history.shift(); 
            
            const snapshot = {
                groupPos: skeletonGroup.position.toArray(),
                joints: joints.map(j => j.position.toArray())
            };
            
            state.history.push(snapshot);
            state.historyStep = state.history.length - 1;
            updateHistoryButtons();
        }

        function applyState(step) {
            const snap = state.history[step];
            skeletonGroup.position.fromArray(snap.groupPos);
            for (let i = 0; i < JOINT_COUNT; i++) {
                joints[i].position.fromArray(snap.joints[i]);
            }
            updateBones();
            transformControl.detach();
        }

        function undo() {
            if (state.historyStep > 0) {
                state.historyStep--;
                applyState(state.historyStep);
                updateHistoryButtons();
            }
        }

        function redo() {
            if (state.historyStep < state.history.length - 1) {
                state.historyStep++;
                applyState(state.historyStep);
                updateHistoryButtons();
            }
        }

        function updateHistoryButtons() {
            btnUndo.disabled = state.historyStep <= 0;
            btnRedo.disabled = state.historyStep >= state.history.length - 1;
        }

        btnUndo.onclick = undo;
        btnRedo.onclick = redo;

        // === UI ACTIONS ===
        document.getElementById('btnReset').onclick = () => {
            skeletonGroup.position.set(0, 0, 0);
            for (let i = 0; i < JOINT_COUNT; i++) joints[i].position.set(...DEFAULT_POSITIONS[i]);
            transformControl.detach();
            updateBones();
            saveHistory();
        };

        const btnToggleSkel = document.getElementById('btnToggleSkel');
        btnToggleSkel.onclick = () => {
            state.skeletonVisible = !state.skeletonVisible;
            skeletonGroup.visible = state.skeletonVisible;
            btnToggleSkel.classList.toggle('active', state.skeletonVisible);
            if (!state.skeletonVisible) transformControl.detach();
        };

        const btnToggleGrid = document.getElementById('btnToggleGrid');
        btnToggleGrid.onclick = () => {
            state.gridVisible = !state.gridVisible;
            gridHelper.visible = state.gridVisible;
            btnToggleGrid.classList.toggle('active', state.gridVisible);
        };

        const btnToggleImage = document.getElementById('btnToggleImage');
        btnToggleImage.onclick = () => {
            state.imageVisible = !state.imageVisible;
            bgImage.style.display = state.imageVisible ? 'block' : 'none';
            btnToggleImage.classList.toggle('active', state.imageVisible);
        };

        const rngThickness = document.getElementById('rngThickness');
        const numThickness = document.getElementById('numThickness');
        const syncThickness = (val) => {
            let v = parseFloat(val);
            if (isNaN(v)) v = 0.5;
            v = Math.max(0.1, Math.min(1.0, v));
            state.thickness = v;
            rngThickness.value = v;
            numThickness.value = v;
            updateBones();
        };
        rngThickness.oninput = (e) => syncThickness(e.target.value);
        numThickness.oninput = (e) => syncThickness(e.target.value);
        numThickness.onchange = (e) => syncThickness(e.target.value);
		
		// === SYNC INITIAL STATE ===
        function syncUI() {
            // Apply visibility to Three.js and DOM
            skeletonGroup.visible = state.skeletonVisible;
            gridHelper.visible = state.gridVisible;
            bgImage.style.display = state.imageVisible ? 'block' : 'none';

            // Sync button classes
            btnToggleSkel.classList.toggle('active', state.skeletonVisible);
            btnToggleGrid.classList.toggle('active', state.gridVisible);
            btnToggleImage.classList.toggle('active', state.imageVisible);

            // Sync sliders
            rngThickness.value = state.thickness;
            numThickness.value = state.thickness;
        }
        syncUI();

        // === RENDER LOOP ===
        function animate() {
            requestAnimationFrame(animate);
            if (state.isDragging && transformControl.object) updateBones();
            renderer.render(scene, camera);
        }
        animate();

        // === EXPORT ===
        function generateOutput(asBase64) {
            transformControl.detach();
            
            const oldWidth = container.clientWidth;
            const oldHeight = container.clientHeight;
            const oldClearColor = renderer.getClearColor(new THREE.Color());
            const oldClearAlpha = renderer.getClearAlpha();
            
            const gridWasVisible = gridHelper.visible;
            const skeletonWasVisible = skeletonGroup.visible;
            
            gridHelper.visible = false;
            skeletonGroup.visible = true; 
            renderer.setClearColor(0x000000, 1); 
            
            camera.aspect = state.imgWidth / state.imgHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(state.imgWidth, state.imgHeight);
            renderer.render(scene, camera);

            const canvas = renderer.domElement;
            const dataUrl = canvas.toDataURL("image/png");

            renderer.setClearColor(oldClearColor, oldClearAlpha);
            gridHelper.visible = gridWasVisible;
            skeletonGroup.visible = skeletonWasVisible;
            camera.aspect = oldWidth / oldHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(oldWidth, oldHeight);
            renderer.render(scene, camera); 

            if (asBase64) return dataUrl;

            fetch(dataUrl).then(res => res.blob()).then(async (blob) => {
                const btn = document.getElementById('btnSaveHost');
                btn.innerText = "SAVING...";
                try {
                    const currentSettings = {
                        thickness: state.thickness,
                        skeletonVisible: state.skeletonVisible,
                        imageVisible: state.imageVisible,
                        gridVisible: state.gridVisible
                    };

                    await fetch(`${API_BASE}/save_mask`, {
                        method: "POST",
                        body: blob,
                        headers: { 
                            "Content-Type": "image/png",
                            "X-Editor-Settings": JSON.stringify(currentSettings)
                        }
                    });
                } catch (e) { console.error(e); } 
                finally { btn.innerText = "Save to node"; }
            });
        }

        document.getElementById('btnSaveHost').onclick = () => generateOutput(false);
        document.getElementById('btnExport').onclick = () => {
            const a = document.createElement('a'); 
            a.href = generateOutput(true); 
            a.download = 'pose_export.png'; 
            a.click();
        };
    </script>
</body>
</html>
