name: 💡 Feature Request
description: Suggest a new feature or enhancement for Graph-N
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the problem. e.g., "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe exactly how you want this feature to work and look in the UI.
    validations:
      required: true